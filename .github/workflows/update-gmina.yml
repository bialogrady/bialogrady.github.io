name: Aktualizuj informacje Gminy Grajewo

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gmina:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Pobierz najnowszą informację
        run: python tools/update_gmina.py
      - name: Zapisz zmianę, jeśli pojawił się nowy artykuł
        run: |
          if git diff --quiet -- content/gmina.json; then
            echo "Brak nowej informacji."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/gmina.json
            git commit -m "Aktualizuj informacje Gminy Grajewo"
            git push
          fi
